[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dexsim"
version = "0.1.0"
description = "Two rail-mounted Shadow Hands learning piano with PPO in MuJoCo"
requires-python = ">=3.10"
# torch is installed separately (CUDA build on the GPU box, CPU on a laptop).
dependencies = [
    "numpy",
    "scipy",
    "mujoco",
    "rsl-rl-lib>=5",
    "gymnasium",
    "tensorboard",
    "pretty_midi",
    "mido",
    "imageio[ffmpeg]",
    "wandb>=0.18",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dexsim*"]
